name: Render FIFO quiz artwork
on:
  push:
    branches:
      - social-quiz-ram-2026-11-23
    paths:
      - "social-quizzes/data-structures-fifo-quiz-2026-11-23.svg"
      - ".github/workflows/render-fifo-quiz.yml"
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
      - name: Render PNG
        run: |
          rsvg-convert -w 1080 -h 1080 -o social-quizzes/data-structures-fifo-quiz-2026-11-23.png social-quizzes/data-structures-fifo-quiz-2026-11-23.svg
      - name: Commit PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social-quizzes/data-structures-fifo-quiz-2026-11-23.png
          git commit -m "Render FIFO quiz PNG [skip ci]" || exit 0
          git push
