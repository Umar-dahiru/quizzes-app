<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#04112f"/><stop offset=".55" stop-color="#073d8c"/><stop offset="1" stop-color="#080b2c"/></linearGradient><linearGradient id="gold"><stop stop-color="#ffd52a"/><stop offset="1" stop-color="#ff9d00"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="1200" rx="48" fill="url(#bg)"/><g opacity=".18" stroke="#35caff" stroke-width="3"><path d="M0 180H1200M0 1020H1200M100 0V1200M1100 0V1200"/><circle cx="100" cy="180" r="8"/><circle cx="1100" cy="1020" r="8"/></g><text x="600" y="92" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="58" font-weight="800">TECHINSPIRE <tspan fill="#ffd52a">4o</tspan></text><rect x="75" y="130" width="1050" height="100" rx="26" fill="url(#gold)"/><text x="600" y="197" text-anchor="middle" fill="#061536" font-family="Arial,sans-serif" font-size="48" font-weight="900">GIT &amp; VERSION CONTROL QUIZ</text><rect x="55" y="275" width="1090" height="280" rx="34" fill="#06183c" stroke="#20d9ff" stroke-width="6" filter="url(#glow)"/><text x="600" y="365" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="52" font-weight="800">Which Git command creates a new</text><text x="600" y="435" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="52" font-weight="800">branch and switches to it</text><text x="600" y="505" text-anchor="middle" fill="#ffd52a" font-family="Arial,sans-serif" font-size="56" font-weight="900">in one step?</text><g font-family="Arial,sans-serif" font-size="42" font-weight="700"><g><rect x="80" y="590" width="1040" height="88" rx="22" fill="#071a40" stroke="#ffd52a" stroke-width="5"/><text x="135" y="648" fill="#ffd52a">A.</text><text x="245" y="648" fill="#fff">git merge</text></g><g><rect x="80" y="690" width="1040" height="88" rx="22" fill="#071a40" stroke="#20d9ff" stroke-width="5"/><text x="135" y="748" fill="#20d9ff">B.</text><text x="245" y="748" fill="#fff">git switch -c</text></g><g><rect x="80" y="790" width="1040" height="88" rx="22" fill="#071a40" stroke="#ffd52a" stroke-width="5"/><text x="135" y="848" fill="#ffd52a">C.</text><text x="245" y="848" fill="#fff">git push</text></g><g><rect x="80" y="890" width="1040" height="88" rx="22" fill="#071a40" stroke="#20d9ff" stroke-width="5"/><text x="135" y="948" fill="#20d9ff">D.</text><text x="245" y="948" fill="#fff">git status</text></g></g><rect x="80" y="1010" width="1040" height="115" rx="28" fill="url(#gold)"/><text x="600" y="1082" text-anchor="middle" fill="#061536" font-family="Arial,sans-serif" font-size="40" font-weight="900">COMMENT YOUR ANSWER: A, B, C OR D</text><text x="600" y="1170" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="22">Learn • Practice • Excel</text></svg>