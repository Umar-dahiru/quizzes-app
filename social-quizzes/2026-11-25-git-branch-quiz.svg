<text x="600" y="370" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="55" font-weight="800">Which Git command creates a</text><text x="600" y="445" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="55" font-weight="800">new branch and switches to it</text><text x="600" y="520" text-anchor="middle" fill="#ffd52a" font-family="Arial,sans-serif" font-size="58" font-weight="900">in one step?</text>
<g font-family="Arial,sans-serif" font-size="48" font-weight="700"><g><rect x="80" y="630" width="1040" height="105" rx="25" fill="#071a40" stroke="#ffd52a" stroke-width="5"/><text x="135" y="699" fill="#ffd52a">A.</text><text x="245" y="699" fill="#fff">git merge</text></g><g><rect x="80" y="755" width="1040" height="105" rx="25" fill="#071a40" stroke="#20d9ff" stroke-width="5"/><text x="135" y="824" fill="#20d9ff">B.</text><text x="245" y="824" fill="#fff">git switch -c</text></g><g><rect x="80" y="880" width="1040" height="105" rx="25" fill="#071a40" stroke="#ffd52a" stroke-width="5"/><text x="135" y="949" fill="#ffd52a">C.</text><text x="245" y="949" fill="#fff">git push</text></g></g>
<rect x="80" y="1015" width="1040" height="115" rx="28" fill="url(#gold)"/><text x="600" y="1088" text-anchor="middle" fill="#061536" font-family="Arial,sans-serif" font-size="43" font-weight="900">COMMENT YOUR ANSWER: A, B, C OR D</text><text x="600" y="1170" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="22">Learn • Practice • Excel</text></svg>